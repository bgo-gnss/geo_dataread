[project]
name = "geo-dataread"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benedikt Gunnar Ófeigsson", email = "bgo@vedur.is" },
    { name = "Maria Fernanda Gonzalez", email = "mariagr@vedur.is" },
]
maintainers = [{ name = "Benedikt Gunnar Ófeigsson", email = "bgo@vedur.is" }]
requires-python = ">=3.13"
dependencies = [
    "geofunc@git+https://github.com/bgo-gnss/geofunc.git",
    "gps_analysis",
    "gps_parser@git+https://github.com/bgo-gnss/gps_parser.git",
    "gtimes>=0.5.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyproj>=3.7.1",
    "scipy>=1.16.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
geo-dataread = "geo_dataread:main"
gps-savetimes = "geo_dataread.gps_savetimes:main"
gps-displacemnts = "geo_dataread.gps_displ:main"
gps-globk-tot = "geo_dataread.globk_tot:main"
gps-estimate-detrend = "geo_dataread.detrend_estimate:main"

[tool.hatch.metadata]
allow-direct-references = true

# Local editable path dep (gps_plot precedent — gpslibrary/CLAUDE.md "Editing
# Across Packages"). gps_analysis has no git remote yet; production packaging
# (git+https pin) is a later item on the refactor-B plan.
[tool.uv.sources]
gps_analysis = { path = "../gps_analysis", editable = true }
gps_parser = { path = "../gps_parser", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Lint/format scope: the maintained GPS lane (gps_read, gps_views,
# gps_savetimes, tests). The legacy auxiliary readers (GAS/SIL/hydro) and the
# legacy displacement CLI are older maintenance-only code with real lint debt
# — excluded per the gps_plot ruff-scope precedent (BGÓ: ignore legacy code)
# until they are deliberately modernized.
[tool.ruff]
extend-exclude = [
    "src/geo_dataread/gas_read.py",   # legacy GAS reader (maintenance only)
    "src/geo_dataread/sil_read.py",   # legacy SIL reader (maintenance only)
    "src/geo_dataread/hytro_read.py", # legacy hydrology reader (maintenance only)
    "src/geo_dataread/gps_displ.py",  # legacy displacement CLI (maintenance only)
]

# Typing policy: `mypy --strict src/` is the gate; the pre-typing legacy
# modules are per-module ignore_errors (same scope rationale as the ruff
# excludes above) so strict typing is enforced on the new view lane
# (gps_views) without rewriting golden-pinned legacy code. Modernization
# ledger: PLAN-geo_dataread-refactor-B.md.
[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "gps_parser.*",
    "geofunc.*",
    "gtimes.*",
    "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "geo_dataread.gps_read",
    "geo_dataread.gas_read",
    "geo_dataread.sil_read",
    "geo_dataread.hytro_read",
    "geo_dataread.gps_displ",
    "geo_dataread.gps_savetimes",
]
ignore_errors = true
